function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function tk(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function imc(p){return(p.peso/Math.pow(p.altura/100,2)).toFixed(1);}
function mhS(h){return`${String(h).padStart(2,"0")}:00`;}
function shiftT(base,off){const[h,m]=base.split(":").map(Number);let nh=h+off;while(nh>=24)nh-=24;return`${String(nh).padStart(2,"0")}:${String(m).padStart(2,"0")}`;}

async function askAI(msg,hist,prof,wml){
  const sys=`Eres nutri-coach experto en "El Milagro Metabólico" de Jaramillo.
USUARIO:${prof.peso}kg·${prof.altura}cm·${OBJS[prof.objetivo].label}·Ventana:${prof.vS}:00-${(prof.vS+prof.vD)%24}:00${prof.posq?"·Posquirúrgico":""}·Agua:${wml}ml/${WATER_GOAL}ml
REGLA:blancas~25%·rojas~30%·huevo=6.5g·lentejas½t=9g·salmón170g=33.6g·pollo170g=37.8g·res170g=54g
Sin azúcar/frituras/harinas. Verduras=base. Grasas buenas siempre. Gelatina sin sabor permitida.
JSON sin markdown:{"type":"meal"|"workout"|"social"|"water"|"question"|"other","summary":"≤50chars","kcal_est":N,"prot_est":N,"ml":N,"feedback":"1-2 frases español"}`;
  const msgs=[...hist.slice(-4).map(m=>({role:m.r,content:m.c})),{role:"user",content:msg}];
  const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({      model:"claude-sonnet-4-5",max_tokens:400,system:sys,messages:msgs})});
  const data=await res.json();
  const txt=(data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
  try{return JSON.parse(txt);}catch{return{type:"other",feedback:txt};}
}

        <button onClick={onClose} style={{background:"transparent",border:"none",color:c.ts,fontSize:20,cursor:"pointer",padding:4}}>✕</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:12}}>
        {Object.entries(OBJS).map(([k,v])=>{const acc=c[v.col],bg=c[v.col+"B"],txt=c[v.col+"T"],active=d.objetivo===k;return <button key={k} onClick={()=>setD({...d,objetivo:k})} style={{padding:"9px 4px",borderRadius:10,cursor:"pointer",border:`1.5px solid ${active?acc:c.bo}`,background:active?bg:c.bgS,color:active?txt:c.ts,fontSize:11,fontWeight:active?500:400,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><span style={{fontSize:17}}>{v.icon}</span>{v.label}</button>;})}

    <div style={{background:c.bgC,border:`0.5px solid ${c.bo}`,borderRadius:14,padding:12,marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:18}}>💧</span><div><p style={{margin:0,fontWeight:500,fontSize:13}}>Hidratación</p><p style={{margin:"1px 0 0",fontSize:10,color:c.ts}}>{(WATER_GOAL/1000).toFixed(1)}L meta</p></div></div>
        <div style={{textAlign:"right"}}><p style={{margin:0,fontSize:15,fontWeight:500,color:done?c.sg:c.wa}}>{(ml/1000).toFixed(2)}L{done&&" ✓"}</p><p style={{margin:0,fontSize:10,color:c.tt}}>{Math.round(pct)}%</p></div>
      </div>
      <div style={{height:11,background:c.waB,borderRadius:8,overflow:"hidden",marginBottom:10}}>
        <div style={{height:"100%",width:`${pct}%`,background:done?c.sg:c.wa,borderRadius:8,transition:"width .5s ease",display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
          {pct>18&&<span style={{fontSize:9,color:"#fff",fontWeight:600,paddingRight:5}}>{ml}ml</span>}
        </div>
      </div>
      <div style={{display:"flex",gap:5}}>
        {[[200,"🥃"],[500,"🍶"],[1000,"🫗"]].map(([v,ic])=><button key={v} onClick={()=>onAdd(v)} style={{flex:1,padding:"7px 3px",fontSize:11,fontWeight:500,border:`0.5px solid ${c.bo}`,borderRadius:8,background:c.bgS,color:c.tx,cursor:"pointer"}}>{ic} +{v<1000?v+"ml":"1L"}</button>)}
        <button onClick={onReset} style={{width:32,border:`0.5px solid ${c.bo}`,borderRadius:8,background:"transparent",color:c.tt,cursor:"pointer",fontSize:13}}>↺</button>
      </div>
    </div>
  );
}

function App(){
  const[c,setC]=useState(L);
  const[tab,setTab]=useState("hoy");
  const todayIdx=new Date().getDay()===0?6:new Date().getDay()-1;
  const[diaIdx,setDiaIdx]=useState(todayIdx);
  const[prof,setProf]=useState(()=>ls("profile",DP));
  const[logs,setLogs]=useState(()=>ls("logs",{}));
  const[chat,setChat]=useState(()=>ls("chat_h",[]));
  const[water,setWater]=useState(()=>ls("water",{}));
  const[input,setInput]=useState("");
  const[busy,setBusy]=useState(false);
  const[chk,setChk]=useState(()=>ls("chk",{}));
  const[editing,setEditing]=useState(false);
  const chatRef=useRef(null);

  useEffect(()=>{const mq=window.matchMedia("(prefers-color-scheme: dark)");setC(mq.matches?D:L);mq.addEventListener("change",e=>setC(e.matches?D:L));},[]);
  useEffect(()=>ss("profile",prof),[prof]);
  useEffect(()=>ss("logs",logs),[logs]);
  useEffect(()=>ss("chat_h",chat.slice(-20)),[chat]);
  useEffect(()=>ss("water",water),[water]);
  useEffect(()=>ss("chk",chk),[chk]);
  useEffect(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},[chat,busy]);

  const TK=tk(),todayLogs=logs[TK]||[],todayWater=water[TK]||0,off=prof.vS-8,obj=OBJS[prof.objetivo],dayData=PLAN[diaIdx];
  // Recalcula horarios del plan según ventana del perfil
  function planTime(diaI, comidaI){
    const bases=[["08:00","12:00","14:00","16:30","18:00"],["08:00","12:00","14:00","16:30","18:00"],["08:00","12:00","14:00","16:30","18:00"],["08:00","13:00","16:00","18:00"],["08:00","12:00","14:00","16:30","18:00"],["08:00","12:00","14:00","16:30","18:00"],["08:00","12:00","15:00","18:00"]];
    const base=bases[diaI]?.[comidaI]||"08:00";
    return shiftT(base, prof.vS-8);
  }

  function addWater(ml){setWater(p=>({...p,[TK]:(p[TK]||0)+ml}));}

  async function send(txt){
    const t=(txt||input).trim();if(!t||busy)return;
    setInput("");setChat(prev=>[...prev,{r:"user",c:t}]);setBusy(true);
    try{
      const res=await askAI(t,chat,prof,todayWater);
      setChat(prev=>[...prev,{r:"assistant",c:res.feedback||"Listo.",d:res}]);
      if(["meal","workout","social"].includes(res.type))
        setLogs(p=>({...p,[TK]:[...(p[TK]||[]),{id:Date.now(),type:res.type,summary:res.summary,kcal:res.kcal_est,prot:res.prot_est,time:new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}]}));
      else if(res.type==="water"&&res.ml)addWater(res.ml);
    }catch{setChat(prev=>[...prev,{r:"assistant",c:"Error al conectar. Intenta de nuevo.",err:true}]);}
    finally{setBusy(false);}
  }

  async function shareList(){
    const pending=COMPRAS.map((cat,ci)=>{const its=cat.items.filter((_,ii)=>!chk[`${ci}-${ii}`]);return its.length?`${cat.cat}:\n${its.map(i=>`  • ${i}`).join("\n")}`:null;}).filter(Boolean).join("\n\n");
    const all=COMPRAS.map((cat,ci)=>`${cat.cat}:\n${cat.items.map((it,ii)=>`  ${chk[`${ci}-${ii}`]?"✓":"•"} ${it}`).join("\n")}`).join("\n\n");
    const txt=`🌿 Mercado — Nutri-Coach\n${new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"})}\n\n${pending||all}`;
    if(navigator.share){try{await navigator.share({title:"Lista de mercado",text:txt});}catch(e){}}
    else{await navigator.clipboard.writeText(txt);alert("Lista copiada al portapapeles");}
  }

  return(
    <div style={{fontFamily:"inherit",color:c.tx,background:c.bg,borderRadius:16,padding:"14px 12px",border:`0.5px solid ${c.bo}`}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:32,height:32,borderRadius:10,background:c.sg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>🌿</div>
          <div><p style={{fontSize:14,fontWeight:500,margin:0}}>Nutri-Coach</p><p style={{fontSize:9,color:c.ts,margin:0}}>Milagro Metabólico · Jaramillo</p></div>
        </div>
        <button onClick={()=>setEditing(true)} style={{background:c.bgS,border:`0.5px solid ${c.bo}`,borderRadius:10,padding:"5px 9px",cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
          <div style={{textAlign:"right"}}><p style={{margin:0,fontSize:11,fontWeight:500,color:c.sg}}>{prof.peso}kg · {prof.altura}cm</p><p style={{margin:0,fontSize:9,color:c.tt}}>{obj.icon} {obj.label}</p></div>
          <span style={{color:c.tt,fontSize:11}}>✎</span>
        </button>
      </div>

      {editing&&<ProfEditor c={c} p={prof} onSave={p=>{setProf(p);setEditing(false);}} onClose={()=>setEditing(false)}/>}

      {!editing&&<>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:3,marginBottom:14,background:c.bgS,padding:3,borderRadius:10}}>
          {TABS.map(t=>{const active=tab===t.id;return <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"7px 2px",fontSize:11,borderRadius:8,cursor:"pointer",border:"none",background:active?c.bgC:"transparent",color:active?c.sg:c.ts,fontWeight:active?500:400,display:"flex",flexDirection:"column",alignItems:"center",gap:1,boxShadow:active?"0 1px 3px rgba(0,0,0,.07)":"none"}}><span style={{fontSize:15}}>{t.i}</span>{t.l}</button>;})}
        </div>

        {tab==="hoy"&&<div>
          <div style={{background:c.bgC,border:`0.5px solid ${c.bo}`,borderRadius:13,padding:11,marginBottom:11}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
              <div><p style={{margin:0,fontSize:13,fontWeight:500}}>{new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"})}</p><p style={{margin:"1px 0 0",fontSize:10,color:c.ts}}>Ventana {mhS(prof.vS)}–{mhS((prof.vS+prof.vD)%24)}</p></div>
              <div style={{display:"flex",gap:5}}>
                <span style={{background:c.teB,color:c.teT,padding:"3px 7px",borderRadius:14,fontSize:11,fontWeight:500}}>🍽 {todayLogs.filter(l=>l.type==="meal").length}</span>
                <span style={{background:c.amB,color:c.amT,padding:"3px 7px",borderRadius:14,fontSize:11,fontWeight:500}}>💪 {todayLogs.filter(l=>l.type==="workout").length}</span>
              </div>
            </div>
            {todayLogs.length>0
              ?<div style={{display:"flex",flexDirection:"column",gap:4}}>{todayLogs.map(l=><div key={l.id} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 7px",background:c.bgM,borderRadius:7}}><span style={{fontSize:13}}>{l.type==="meal"?"🍽":l.type==="workout"?"💪":"🍷"}</span><span style={{flex:1,fontSize:11,color:c.tx}}>{l.summary}</span><div style={{display:"flex",gap:4,flexShrink:0}}>{l.prot&&<span style={{fontSize:9,color:c.teT,fontWeight:500}}>{l.prot}g</span>}{l.kcal&&<span style={{fontSize:9,color:c.ts}}>{l.kcal}kcal</span>}<span style={{fontSize:9,color:c.tt}}>{l.time}</span></div></div>)}</div>
              :<p style={{margin:0,fontSize:11,color:c.tt,fontStyle:"italic"}}>Sin registros aún</p>}
          </div>
          <Water c={c} ml={todayWater} onAdd={addWater} onReset={()=>setWater(p=>({...p,[TK]:0}))}/>
          <div style={{background:c.bgC,border:`0.5px solid ${c.bo}`,borderRadius:13,overflow:"hidden"}}>
            <div style={{padding:"7px 11px",borderBottom:`0.5px solid ${c.bs}`,display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:c.sg}}/><span style={{fontSize:12,fontWeight:500}}>Coach IA</span>
              <span style={{fontSize:9,color:c.tt,marginLeft:"auto"}}>comidas · entrenos · agua</span>
            </div>
            <div ref={chatRef} style={{maxHeight:240,overflowY:"auto",padding:10,display:"flex",flexDirection:"column",gap:7}}>
              {chat.length===0&&<div style={{padding:"10px 4px",textAlign:"center"}}><p style={{fontSize:26,margin:"0 0 4px"}}>🌿</p><p style={{margin:"0 0 8px",fontSize:11,color:c.ts}}>Cuéntame tu día</p><div style={{display:"flex",flexWrap:"wrap",gap:4,justifyContent:"center"}}>{["Comí 2 huevos","Hice espalda al fallo","Tomé medio litro agua"].map(s=><button key={s} onClick={()=>send(s)} style={{fontSize:10,padding:"4px 7px",borderRadius:12,border:`0.5px solid ${c.bo}`,background:c.bgS,color:c.ts,cursor:"pointer"}}>{s}</button>)}</div></div>}
              {chat.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.r==="user"?"flex-end":"flex-start"}}><div style={{maxWidth:"80%",background:m.r==="user"?c.sg:(m.err?c.teB:c.bgS),color:m.r==="user"?"#fff":(m.err?c.teT:c.tx),padding:"7px 10px",borderRadius:11,borderBottomRightRadius:m.r==="user"?3:11,borderBottomLeftRadius:m.r==="user"?11:3,fontSize:12,lineHeight:1.5}}>
                {m.c}
                {m.d&&["meal","workout","social","water"].includes(m.d.type)&&<div style={{marginTop:4,paddingTop:4,borderTop:`0.5px solid rgba(255,255,255,.2)`,fontSize:9,opacity:.85}}>✓ {m.d.type==="water"?`+${m.d.ml}ml agua`:`${m.d.summary}${m.d.kcal_est?` · ${m.d.kcal_est}kcal`:""}${m.d.prot_est?` · ${m.d.prot_est}g prot.`:""}`}</div>}
              </div></div>)}
              {busy&&<div style={{display:"flex"}}><div style={{background:c.bgS,padding:"6px 10px",borderRadius:10,fontSize:11,color:c.ts}}>Pensando...</div></div>}
            </div>
            <div style={{borderTop:`0.5px solid ${c.bs}`,padding:7,display:"flex",gap:6,background:c.bgM}}>
              <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Comí, entrené, tomé..." disabled={busy} style={{flex:1,padding:"7px 9px",fontSize:12,borderRadius:8,border:`0.5px solid ${c.bo}`,background:c.bgC,color:c.tx,outline:"none",fontFamily:"inherit"}}/>
              <button onClick={()=>send()} disabled={busy||!input.trim()} style={{padding:"0 12px",fontSize:14,borderRadius:8,border:"none",background:input.trim()&&!busy?c.sg:c.bgS,color:input.trim()&&!busy?"#fff":c.tt,cursor:input.trim()&&!busy?"pointer":"not-allowed"}}>→</button>
            </div>
          </div>
          {chat.length>0&&<button onClick={()=>setChat([])} style={{marginTop:5,fontSize:10,color:c.tt,background:"transparent",border:"none",cursor:"pointer",padding:3}}>Limpiar chat</button>}
        </div>}

        {tab==="plan"&&<div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:11}}>
            {DIAS_S.map((d,i)=><button key={i} onClick={()=>setDiaIdx(i)} style={{padding:"6px 2px",borderRadius:8,cursor:"pointer",fontSize:10,border:"none",background:i===diaIdx?c.sg:c.bgS,color:i===diaIdx?"#fff":c.ts,display:"flex",flexDirection:"column",alignItems:"center",gap:1,fontWeight:i===diaIdx?500:400,position:"relative"}}>
              {i===todayIdx&&<div style={{position:"absolute",top:2,right:4,width:4,height:4,borderRadius:"50%",background:i===diaIdx?"rgba(255,255,255,.7)":c.sg}}/>}
              <span>{d}</span><span style={{fontSize:9}}>{PLAN[i].e?"🏃":"😴"}</span>
            </button>)}
          </div>
          <div style={{background:c.sgB,borderRadius:10,padding:"7px 11px",marginBottom:11,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><p style={{margin:0,fontSize:13,fontWeight:500,color:c.sgT}}>{DIAS_F[diaIdx]}{diaIdx===todayIdx&&<span style={{fontSize:10,marginLeft:6,opacity:.7}}>· hoy</span>}</p><p style={{margin:"1px 0 0",fontSize:10,color:c.sgT}}>{dayData.tag}</p></div>
            <div style={{textAlign:"right"}}>
              <span style={{fontSize:10,fontWeight:500,color:c.teT,background:c.teB,padding:"2px 6px",borderRadius:10,display:"block",marginBottom:3}}>~{dayData.c.reduce((s,m)=>s+(m[1]||0),0)}g prot.</span>
              <span style={{fontSize:10,fontWeight:500,color:c.sgT,background:"rgba(255,255,255,.5)",padding:"2px 6px",borderRadius:10}}>~{dayData.c.reduce((s,m)=>s+(m[0]||0),0)} kcal</span>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {dayData.c.map(([kcal,prot,ic,nom,items],i)=><div key={i} style={{background:c.bgC,border:`0.5px solid ${c.bo}`,borderRadius:11,overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 11px",background:c.bgM}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:16}}>{ic}</span><span style={{fontWeight:500,fontSize:12}}>{nom}</span></div>
                <div style={{display:"flex",gap:3,alignItems:"center"}}>
                  {prot>0&&<span style={{fontSize:9,color:c.teT,background:c.teB,padding:"2px 5px",borderRadius:9,fontWeight:500}}>{prot}g</span>}
                  {kcal>0&&<span style={{fontSize:9,color:c.sgT,background:c.sgB,padding:"2px 5px",borderRadius:9,fontWeight:500}}>{kcal}kcal</span>}
                  <span style={{fontSize:9,color:c.ts,fontWeight:500,marginLeft:2}}>{planTime(diaIdx,i)}</span>
                </div>
              </div>
              <ul style={{margin:0,padding:"6px 11px 8px 24px",fontSize:11,color:c.ts,lineHeight:1.8}}>{items.map((it,j)=><li key={j}>{it}</li>)}</ul>
            </div>)}
          </div>
          {dayData.e&&<div style={{marginTop:9,background:c.teB,borderRadius:9,padding:"8px 11px",fontSize:11,color:c.teT,display:"flex",gap:6}}><span>🏃</span><span>Come post-entreno en los primeros 30-45 min.{prof.posq&&" Intensidad moderada."}</span></div>}
        </div>}

        {tab==="cocina"&&<div>
          {COCINA_PLAN.map((d,di)=>{
            const bg=c[d.color+"B"]||c.amB,txt=c[d.color+"T"]||c.amT,acc=c[d.color]||c.am;
            return <div key={di} style={{marginBottom:14}}>
              <div style={{background:bg,borderRadius:12,padding:"10px 12px",marginBottom:8,border:`0.5px solid ${acc}`}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
                  <span style={{fontSize:16}}>{d.badge}</span>
                  <span style={{fontWeight:500,fontSize:13,color:txt}}>{d.dia}</span>
                </div>
                <p style={{margin:"2px 0 0",fontSize:12,fontWeight:500,color:txt}}>{d.titulo}</p>
                <p style={{margin:"2px 0 0",fontSize:10,color:txt,opacity:.85,fontStyle:"italic"}}>{d.urgente}</p>
              </div>
              {d.compra&&<div style={{background:c.bgC,border:`0.5px solid ${c.bo}`,borderRadius:11,padding:"10px 12px",marginBottom:8}}>
                <p style={{margin:"0 0 6px",fontSize:12,fontWeight:500,color:c.tx}}>🛒 Qué comprar · <span style={{color:c.ts,fontWeight:400,fontSize:11}}>{d.compra.cuando}</span></p>
                <ul style={{margin:0,padding:"0 0 0 18px",fontSize:11,color:c.ts,lineHeight:1.9}}>{d.compra.items.map((it,i)=><li key={i}>{it}</li>)}</ul>
              </div>}
              {d.batch.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6}}>
                {d.batch.map((b,bi)=><div key={bi} style={{background:c.bgC,border:`0.5px solid ${c.bo}`,borderRadius:11,padding:"9px 12px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:4}}>
                    <span style={{fontSize:16}}>{b.emoji}</span>
                    <span style={{fontWeight:500,fontSize:12,flex:1}}>{b.nombre}</span>
                    <span style={{fontSize:10,color:c.tt,background:c.bgS,padding:"2px 6px",borderRadius:8}}>{b.tiempo}</span>
                  </div>
                  <p style={{margin:0,fontSize:11,color:c.ts,lineHeight:1.6,paddingLeft:24}}>{b.como}</p>
                </div>)}
              </div>}
              {d.orden&&<div style={{marginTop:8,background:c.bgS,borderRadius:9,padding:"8px 11px",fontSize:11,color:c.ts,lineHeight:1.6}}><span style={{fontWeight:500,color:c.tx}}>💡 Orden: </span>{d.orden}</div>}
            </div>;
          })}
        </div>}

        {tab==="compras"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
            <div><p style={{margin:0,fontSize:13,fontWeight:500}}>Lista semanal</p><p style={{margin:"2px 0 0",fontSize:10,color:c.ts}}>Compra dom/lun · Frescos mié/jue</p></div>
            <span style={{fontSize:11,background:c.sgB,color:c.sgT,padding:"3px 9px",borderRadius:14,fontWeight:500}}>{Object.values(chk).filter(Boolean).length}/{COMPRAS.reduce((s,k)=>s+k.items.length,0)}</span>
          </div>
          {COMPRAS.map((cat,ci)=><div key={ci} style={{marginBottom:9,borderRadius:11,border:`0.5px solid ${c.bo}`,overflow:"hidden"}}>
            <div style={{background:c.bgS,padding:"7px 11px",borderBottom:`0.5px solid ${c.bo}`}}><span style={{fontWeight:500,fontSize:12,color:c.tx}}>{cat.cat}</span></div>
            <div style={{background:c.bgC}}>{cat.items.map((item,ii)=>{const k=`${ci}-${ii}`,done=chk[k];return <div key={ii} onClick={()=>setChk(p=>({...p,[k]:!p[k]}))} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 11px",cursor:"pointer",background:done?c.sgB:"transparent",borderTop:ii>0?`0.5px solid ${c.bs}`:"none"}}>
              <div style={{width:15,height:15,borderRadius:4,border:`1.5px solid ${done?c.sg:c.bo}`,background:done?c.sg:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{done&&<span style={{color:"#fff",fontSize:9,fontWeight:700}}>✓</span>}</div>
              <span style={{fontSize:11,color:done?c.tt:c.tx,textDecoration:done?"line-through":"none"}}>{item}</span>
            </div>;})}</div>
          </div>)}
          <div style={{display:"flex",gap:7,marginTop:7}}>
            <button onClick={()=>setChk({})} style={{fontSize:11,color:c.tt,background:"transparent",border:`0.5px solid ${c.bo}`,borderRadius:8,padding:"7px 11px",cursor:"pointer"}}>↺ Reiniciar</button>
            <button onClick={shareList} style={{flex:1,fontSize:12,fontWeight:500,color:"#fff",background:c.sg,border:"none",borderRadius:8,padding:"7px 11px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}><span style={{fontSize:14}}>↑</span> Compartir lista</button>
          </div>
        </div>}
      </>}
      <div style={{marginTop:12,paddingTop:9,borderTop:`0.5px solid ${c.bs}`,fontSize:9,color:c.tt,textAlign:"center"}}>Nutri-Coach · Milagro Metabólico · Jaramillo</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
